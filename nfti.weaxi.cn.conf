# ─────────────────────────────────────────────────────────────────────────────
# Nginx 反向代理示例（宿主机层）
#
# 说明：本文件是「宿主机 Nginx → Docker 容器」这一层的配置示例。
#      项目自身的容器内配置见 frontend/nginx.conf。
#
# ⚠️ 本文件已做通用化处理：所有真实服务器路径/面板信息已替换为占位符。
#    部署时请按自己的环境修改 <PATH>、证书路径与上游端口。
# ─────────────────────────────────────────────────────────────────────────────

# 缓存区（可选）：如不需要可整段删除
proxy_cache_path <PATH>/proxy_cache_dir levels=1:2
                 keys_zone=nfti_cache:20m inactive=1d max_size=5g;

# ── WebSocket 支持（可选）──
# ⚠️ map 必须定义在 http {} 块内、server {} 之外（放在 server 内会报错：
#    "map" directive is not allowed here）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP → HTTPS 跳转
server {
    listen 80;
    listen [::]:80;
    server_name nfti.weaxi.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nfti.weaxi.cn;

    # SSL 证书（请替换为你的证书路径）
    ssl_certificate     /etc/letsencrypt/live/<YOUR_DOMAIN>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<YOUR_DOMAIN>/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    index index.html;
    root <PATH>/nfti;

    # ── 反向代理到容器内的前端 Nginx（docker-compose 暴露在 127.0.0.1:8081）──
    location ^~ / {
        proxy_pass http://127.0.0.1:8081;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Real-Port       $remote_port;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # ── 屏蔽敏感文件的直接访问 ──
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README\.md) {
        return 404;
    }

    location /.well-known {
        allow all;
    }
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    # ── 日志（请按自己的目录调整）──
    access_log <PATH>/logs/nfti.weaxi.cn.log;
    error_log  <PATH>/logs/nfti.weaxi.cn.error.log;
}
