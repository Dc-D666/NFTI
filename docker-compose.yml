# NF-BTI / NFTI 部署编排（Docker Compose）
#
# ⚠️ 本文件**不含任何真实凭据**（仓库公开）。所有密钥/密码通过环境变量注入：
#    1) 在本目录创建 .env（已 gitignore），或
#    2) 由 CI/部署平台注入环境变量
#    参考 .env.example 填写。
services:
  backend:
    build: ./backend
    container_name: nfbti-backend
    environment:
      DB_TYPE: mysql
      DB_HOST: ${DB_HOST:-172.20.0.1}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-nfti}
      DB_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
      DB_NAME: ${DB_NAME:-nfti}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?请在 .env 中设置 DEEPSEEK_API_KEY}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      EMAILJS_SERVICE_ID: ${EMAILJS_SERVICE_ID:-}
      EMAILJS_TEMPLATE_ID: ${EMAILJS_TEMPLATE_ID:-}
      EMAILJS_PUBLIC_KEY: ${EMAILJS_PUBLIC_KEY:-}
      FEEDBACK_RECIPIENT: ${FEEDBACK_RECIPIENT:-}
      NODE_OPTIONS: --max-old-space-size=256
      NODE_EXTRA_CA_CERTS: /app/qq-root.crt
      # 跨站体验任务（可选）：需与 PatPlayer 的 PAT_TICKET_SECRET 保持一致；
      # 不填则「南中科技局 → 人格测试」的跨站体验功能不可用，其余功能不受影响。
      PAT_TICKET_SECRET: ${PAT_TICKET_SECRET:-}
      PATPLAYER_SESSIONS_DIR: /patplayer-sessions
      # PatPlayer 服务端地址（ticket 换发真实会话 ID 用）
      PAT_BASE_URL: ${PAT_BASE_URL:-https://pat.weaxi.cn}
    depends_on: []
    volumes:
      - ./backend/data:/app/data
      # 腾讯 QQ 根证书：需自备（见 backend/README 说明），不再随仓库分发
      - ./backend/qq-root.crt:/app/qq-root.crt:ro
      # 跨站体验任务：只读挂载 PatPlayer 的 QQ 会话目录（复用其 token，禁止写入）
      # 不部署该功能时可删除此行
      - ${PATPLAYER_SESSIONS_DIR_HOST:-/home/PatPlayer/storage/qq-sessions}:/patplayer-sessions:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  nginx:
    build: ./frontend
    container_name: nfbti-nginx
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 16M

volumes: {}
